# Alembic = version history for the database schema.
# Run from the project root:  backend/venv/bin/alembic -c backend/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
# env.py adds backend/ to the import path itself (works even with spaces in the folder name)
path_separator = os
# The database URL comes from app.core.config (i.e. .env), not from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
